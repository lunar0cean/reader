name: YeJian
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"
    PRODUCT_BUNDLE_IDENTIFIER: com.lunar0cean.yejian
    CODE_SIGNING_ALLOWED: "NO"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    exactVersion: 2.8.3
  SwiftMarkdown:
    url: https://github.com/swiftlang/swift-markdown.git
    exactVersion: 0.5.0
  SwiftCMark:
    url: https://github.com/apple/swift-cmark.git
    exactVersion: 0.5.0
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager.git
    exactVersion: 1.24.2
targets:
  YeJian:
    type: application
    platform: iOS
    sources:
      - path: Native
      - path: Voice
        excludes: ["Frontend/**", "Japanese/**", "Native/src/**", "Native/Cargo.toml", "NOTICE.md"]
      - path: Voice/Frontend
        type: folder
        buildPhase: resources
      - path: Voice/NOTICE.md
        buildPhase: resources
      - path: Resources/library.json
        buildPhase: resources
      - path: Resources/notebook.json
        buildPhase: resources
      - path: Resources/Fonts
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/Fixtures
        buildPhase: resources
    dependencies:
      - package: ZIPFoundation
      - package: SwiftSoup
      - package: SwiftMarkdown
        product: Markdown
      - package: onnxruntime
        product: onnxruntime
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_FILE: Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: 阅读器
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        MARKETING_VERSION: "0.9.1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTS_MACCATALYST: "NO"
        SWIFT_OBJC_BRIDGING_HEADER: Voice/Native/gsv_native.h
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": "$(inherited) $(PROJECT_DIR)/Voice/Japanese/target/aarch64-apple-ios/release"
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": "$(inherited) $(PROJECT_DIR)/Voice/Japanese/target/ios-simulator"
        OTHER_LDFLAGS: "$(inherited) -lgsv_native -liconv -lresolv"
  YeJianTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: YeJian
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lunar0cean.yejian.tests
        GENERATE_INFOPLIST_FILE: "YES"
  YeJianUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: YeJian
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lunar0cean.yejian.uitests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  YeJian:
    build:
      targets:
        YeJian: all
    test:
      targets: [YeJianTests, YeJianUITests]
      gatherCoverageData: false

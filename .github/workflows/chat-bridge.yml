name: ChatGPT 插件服务 · 检查
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - "chat-bridge/**"
      - ".github/workflows/chat-bridge.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: chat-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chat-bridge/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
